# ─── CHATR Real-Time NGINX Config ─────────────────────────────────────────
#
# Provides:
#   - Sticky sessions (ip_hash) for WebSocket connection stability
#   - WebSocket upgrade headers
#   - Gzip compression for REST API payloads
#   - Load balancing across multiple Node.js instances
#
# To scale: add more server entries to the upstream block and
# start additional Node.js instances on different ports.

events {
  worker_connections 4096;
}

http {
  # ── Upstream: Socket.IO server instances ─────────────────────────────
  upstream chatr_realtime {
    ip_hash;                          # Sticky sessions — required for WebSocket

    server 127.0.0.1:3000;            # Instance 1 (primary)
    # server 127.0.0.1:3001;          # Instance 2 (uncomment to add)
    # server 127.0.0.1:3002;          # Instance 3 (uncomment to add)

    keepalive 64;
  }

  # ── Gzip ──────────────────────────────────────────────────────────────
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1024;
  gzip_comp_level 4;

  # ── WebSocket proxy map ───────────────────────────────────────────────
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # ── REST API + Socket.IO (unified port 3000 per spec) ──────────────
    location / {
      proxy_pass http://chatr_realtime;

      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Forward real client IP (for rate limiting)
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;

      # Long timeout for persistent connections
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # Disable buffering for real-time responses
      proxy_buffering off;
    }

    # ── Health check (no upstream needed) ─────────────────────────────
    location /health {
      proxy_pass http://chatr_realtime/health;
      access_log off;
    }
  }
}
