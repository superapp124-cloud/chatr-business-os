identity:
  id: hr.job.application
  version: 1.0.0
  displayName: "Job Application Lifecycle"
  description: "Manages the multi-stage, human-driven lifecycle of a candidate application."
  author: "CHATR Enterprise"
  license: "MIT"
  category: "Human Resources"
  tags: ["recruitment", "hr", "candidate"]

runtime:
  intentTypes: ["hr.job.application"]
  permissions: ["calendar", "email", "document_store"]
  inputs: ["candidateId", "jobId", "resumeUrl"]
  outputs: ["applicationStatus", "offerDetails"]
  events: ["hr.interview.scheduled", "hr.offer.sent"]
  policies: ["hr.compliance.eeoc"]
  verification:
    strategy: hr_ats_sync@1.0
  stewardship:
    renewable: false
    expiration: offer_accepted

metadata:
  minKernelVersion: "1.0"
  maxKernelVersion: "2.0"
  dependencies: []
  supportedPlatforms: ["desktop", "web"]
  securityClassification: "confidential"
  profile: "Full"
